<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZÌDÒNG // CYBER-HMI TERMINAL</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#04070d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tipografía Militar / Futurista -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;800&family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+SC:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #03060b;
            --cyber-cyan: #00f0ff;
            --cyber-yellow: #fcee0a;
            --cyber-red: #ff003c;
            --cyber-green: #00ff66;
            --metal-frame: #0b1320;
            --panel-inner: rgba(7, 14, 27, 0.88);
            --border-glow: rgba(0, 240, 255, 0.35);
            --text-pure: #ffffff;
            --text-dim: #798a9c;
            --font-display: 'Orbitron', sans-serif;
            --font-tech: 'Chakra Petch', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-hanzi: 'Noto Sans SC', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-pure);
            font-family: var(--font-tech);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* REJILLA DE RADAR Y SCANLINES CRT */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.6;
        }

        .terminal-container {
            width: 100%;
            max-width: 460px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 14px 12px 14px;
            position: relative;
            z-index: 1;
        }

        /* HUD CYBERPUNK */
        .cyber-hud {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(11, 19, 32, 0.9);
            border: 1px solid var(--border-glow);
            padding: 6px 10px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .op-badge-cyber {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.1s ease;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
        }
        .op-badge-cyber:active {
            transform: scale(0.96);
            background: rgba(0, 240, 255, 0.25);
        }
        .op-avatar {
            width: 22px;
            height: 22px;
            background: var(--cyber-yellow);
            color: #000;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px var(--cyber-yellow);
        }
        .op-meta {
            display: flex;
            flex-direction: column;
            line-height: 1;
            text-align: left;
        }
        .op-name {
            font-size: 0.72rem;
            font-weight: 800;
            color: #fff;
            max-width: 65px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .op-rank {
            font-size: 0.58rem;
            font-family: var(--font-mono);
            color: var(--cyber-cyan);
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .hud-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #060b13;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 7px;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
        }
        .hud-tag-streak { color: var(--cyber-yellow); border-color: rgba(252, 238, 10, 0.3); }
        .hud-tag-xp { color: var(--cyber-cyan); border-color: rgba(0, 240, 255, 0.3); }

        .system-select-wrapper {
            flex: 1;
            position: relative;
        }
        .system-select {
            width: 100%;
            appearance: none;
            background: #060b13;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--text-pure);
            padding: 5px 18px 5px 6px;
            font-size: 0.7rem;
            font-family: var(--font-tech);
            font-weight: 700;
            outline: none;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
        .system-select-wrapper::after {
            content: "▼";
            font-size: 0.5rem;
            color: var(--cyber-cyan);
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* BARRA DE CICLO / RECARGA */
        .cyber-progress-track {
            height: 5px;
            background: #060b13;
            border: 1px solid rgba(0, 240, 255, 0.2);
            margin: 6px 0;
            overflow: hidden;
            position: relative;
        }
        .cyber-progress-bar {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-yellow));
            box-shadow: 0 0 10px var(--cyber-cyan);
            transition: width 0.25s ease;
        }

        /* SELECTOR DE NIVEL ESTILO MILITAR */
        .level-strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 6px;
        }
        .level-pill {
            background: #070e1b;
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: var(--text-dim);
            padding: 5px;
            font-size: 0.72rem;
            font-family: var(--font-tech);
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-transform: uppercase;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            transition: all 0.15s;
        }
        .level-pill.active {
            background: rgba(0, 240, 255, 0.15);
            color: var(--cyber-cyan);
            border-color: var(--cyber-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        /* WORKSPACE Y CHASIS CYBER */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .mode-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }
        .mode-screen.active {
            display: flex;
        }

        .cyber-chassis {
            background: var(--panel-inner);
            border: 1px solid var(--border-glow);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px 14px;
            position: relative;
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.05);
            overflow-y: auto;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* ESQUINAS TÁCTICAS */
        .cyber-chassis::before {
            content: "// SEC-HMI 4.0";
            position: absolute;
            top: 6px;
            left: 12px;
            font-family: var(--font-mono);
            font-size: 0.55rem;
            color: var(--cyber-cyan);
            letter-spacing: 1px;
            opacity: 0.7;
        }
        .cyber-chassis::after {
            content: "STATE: LIVE";
            position: absolute;
            bottom: 6px;
            right: 12px;
            font-family: var(--font-mono);
            font-size: 0.55rem;
            color: var(--cyber-yellow);
            letter-spacing: 1px;
            opacity: 0.8;
        }

        /* SHAKE DE ERROR */
        .screen-shake {
            animation: cyber-shake 0.35s cubic-bezier(.36,.07,.19,.97) both;
            border-color: var(--cyber-red) !important;
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.5) !important;
        }
        @keyframes cyber-shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(3px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* COMBO OVERDRIVE GLOW */
        .overdrive-active {
            border-color: var(--cyber-yellow) !important;
            box-shadow: 0 0 25px rgba(252, 238, 10, 0.4), inset 0 0 15px rgba(252, 238, 10, 0.1) !important;
        }

        .hanzi-viewport {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4px;
        }
        .hanzi-character {
            font-family: var(--font-hanzi);
            font-size: 5.2rem;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 0 20px var(--cyber-cyan), 0 0 40px rgba(0, 240, 255, 0.4);
        }

        .meaning-title {
            font-size: 1.35rem;
            font-family: var(--font-tech);
            font-weight: 800;
            line-height: 1.2;
            color: var(--cyber-yellow);
            text-shadow: 0 0 10px rgba(252, 238, 10, 0.5);
            text-align: center;
            margin: 6px 0;
            max-width: 95%;
        }

        .pinyin-label {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--cyber-cyan);
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .inspect-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            color: var(--cyber-cyan);
            padding: 4px 10px;
            font-size: 0.68rem;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        .nav-actions-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        /* TELEMETRÍA Y CAJAS */
        .telemetry-box {
            width: 100%;
            background: #040810;
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 8px 10px;
            margin-top: 8px;
            text-align: left;
            clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
        }
        .telemetry-chips {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin: 4px 0;
        }
        .telemetry-chip {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 2px 6px;
            font-size: 0.7rem;
            font-family: var(--font-mono);
        }
        .telemetry-chip strong { color: var(--cyber-yellow); }
        .telemetry-log {
            font-size: 0.72rem;
            color: var(--text-dim);
            line-height: 1.35;
        }

        /* QUIZ */
        .quiz-options-matrix {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .matrix-button {
            background: #081120;
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-left: 3px solid var(--cyber-cyan);
            color: #ffffff;
            padding: 10px 6px;
            font-size: 0.8rem;
            font-family: var(--font-tech);
            font-weight: 700;
            min-height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.1s ease;
            clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
        }
        .matrix-button:active {
            transform: scale(0.97);
            background: rgba(0, 240, 255, 0.2);
        }
        .matrix-button.correct {
            background: rgba(0, 255, 102, 0.2) !important;
            border-color: var(--cyber-green) !important;
            border-left: 3px solid var(--cyber-green) !important;
            color: #afffd0 !important;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
        }
        .matrix-button.incorrect {
            background: rgba(255, 0, 60, 0.2) !important;
            border-color: var(--cyber-red) !important;
            border-left: 3px solid var(--cyber-red) !important;
            color: #ffa1b2 !important;
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.4);
        }

        /* ENSAMBLE */
        .assembly-rail {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 8px 0;
        }
        .assembly-slot {
            width: 52px;
            height: 52px;
            border: 2px dashed rgba(0, 240, 255, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-hanzi);
            font-size: 1.8rem;
            font-weight: 700;
            background: #040810;
            cursor: pointer;
        }
        .assembly-slot.active-dock {
            border: 2px solid var(--cyber-cyan);
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .parts-tray {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: #040810;
            padding: 8px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            margin-top: 8px;
        }
        .component-tile {
            width: 48px;
            height: 48px;
            background: #0a1424;
            border: 1px solid var(--cyber-cyan);
            color: #ffffff;
            font-family: var(--font-hanzi);
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.08s ease;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }
        .component-tile:active {
            transform: scale(0.92);
        }
        .component-tile.used {
            opacity: 0.15;
            pointer-events: none;
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* ESCÁNER TERMINAL */
        .terminal-display {
            width: 100%;
            background: #020408;
            border: 1px solid rgba(255, 0, 60, 0.4);
            border-left: 4px solid var(--cyber-red);
            padding: 10px;
            font-family: var(--font-mono);
            font-size: 1.1rem;
            line-height: 1.7;
            margin: 8px 0;
            box-shadow: inset 0 0 10px rgba(255, 0, 60, 0.1);
        }
        .terminal-token {
            display: inline-block;
            padding: 2px 5px;
            margin: 2px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.12s;
        }
        .terminal-token:hover {
            border-color: var(--cyber-cyan);
            background: rgba(0, 240, 255, 0.15);
        }
        .terminal-token.token-static {
            cursor: default;
            color: #445366;
        }
        .terminal-token.token-static:hover {
            border-color: transparent;
            background: transparent;
        }
        .terminal-token.success-hit {
            background: var(--cyber-green) !important;
            color: #000 !important;
            font-weight: 900;
            box-shadow: 0 0 12px var(--cyber-green);
        }
        .terminal-token.fail-hit {
            background: var(--cyber-red) !important;
            color: #fff !important;
        }

        /* BOTONES CYBERPUNK */
        .btn-core {
            border: none;
            font-family: var(--font-tech);
            font-weight: 800;
            font-size: 0.88rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .btn-core:active {
            transform: scale(0.97);
        }

        .btn-cyan {
            background: var(--cyber-cyan);
            color: #03060b;
            padding: 11px 16px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
            font-weight: 900;
        }
        .btn-ghost {
            background: #081120;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--cyber-cyan);
            padding: 7px 12px;
            font-size: 0.75rem;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        .full-trigger {
            width: 100%;
            margin-top: 8px;
            display: none;
        }

        .summary-dashboard {
            background: var(--panel-inner);
            border: 2px solid var(--cyber-cyan);
            padding: 22px 14px;
            text-align: center;
            margin: auto 0;
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        /* DOCK DE MISIONES */
        .cyber-dock {
            height: 56px;
            background: rgba(7, 14, 27, 0.95);
            border: 1px solid var(--border-glow);
            display: flex;
            align-items: center;
            padding: 2px 4px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.8);
        }

        .dock-item {
            flex: 1;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            padding: 5px 0;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }
        .dock-svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: square;
        }
        .dock-title {
            font-size: 0.62rem;
            font-family: var(--font-tech);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .dock-item.active {
            color: var(--cyber-cyan);
        }
        .dock-item.active::after {
            content: "";
            position: absolute;
            bottom: 2px;
            width: 14px;
            height: 2px;
            background: var(--cyber-cyan);
            box-shadow: 0 0 6px var(--cyber-cyan);
        }

        /* MODAL DE CREDENCIAL CYBER */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 4, 8, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-overlay.active {
            display: flex;
        }

        .badge-card {
            width: 100%;
            max-width: 350px;
            background: #060c16;
            border: 2px solid var(--cyber-cyan);
            padding: 18px 16px;
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.25);
            text-align: center;
        }
        .badge-header {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            color: var(--cyber-cyan);
            letter-spacing: 2px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
            padding-bottom: 4px;
        }
        .badge-avatar-frame {
            width: 68px;
            height: 68px;
            margin: 0 auto 10px auto;
            background: var(--cyber-yellow);
            color: #000;
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            box-shadow: 0 0 16px var(--cyber-yellow);
        }
        .badge-input-name {
            background: #02050a;
            border: 1px solid var(--cyber-cyan);
            color: #ffffff;
            font-family: var(--font-tech);
            font-size: 1.1rem;
            font-weight: 800;
            text-align: center;
            padding: 5px 8px;
            width: 80%;
            margin-bottom: 6px;
            outline: none;
        }
        .badge-rank-title {
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--cyber-cyan);
            margin-bottom: 4px;
        }
        .badge-access-tag {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            color: var(--cyber-yellow);
            background: rgba(252, 238, 10, 0.08);
            border: 1px solid rgba(252, 238, 10, 0.25);
            padding: 2px 6px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .badge-level-bar-bg {
            background: #02050a;
            border: 1px solid rgba(0, 240, 255, 0.2);
            height: 6px;
            margin-bottom: 6px;
        }
        .badge-level-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-yellow));
            box-shadow: 0 0 8px var(--cyber-cyan);
            transition: width 0.3s ease;
        }
        .badge-xp-text {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 12px;
        }
        .badge-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 14px;
        }
        .badge-stat-box {
            background: #02050a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px;
        }
        .badge-stat-val {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--cyber-yellow);
        }
        .badge-stat-lbl {
            font-size: 0.6rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <!-- HUD SUPERIOR TÁCTICO -->
    <header class="cyber-hud">
        <div class="op-badge-cyber" onclick="openProfileModal()" title="Credencial de Planta">
            <div id="hud-avatar" class="op-avatar">R</div>
            <div class="op-meta">
                <span id="hud-username" class="op-name">Raymundo</span>
                <span id="hud-userrank" class="op-rank">Practicante</span>
            </div>
        </div>

        <div class="hud-tag hud-tag-streak" title="Racha activa">
            <span>🔥</span>
            <span id="hud-streak-count">1</span>
        </div>
        <div class="hud-tag hud-tag-xp" title="Experiencia acumulada">
            <span>⚡</span>
            <span id="hud-xp-count">0 XP</span>
        </div>
        <div class="system-select-wrapper">
            <select id="category-selector" class="system-select" onchange="changeCategory(this.value)">
                <option value="todos">🌐 SYS: GENERAL</option>
                <option value="alarmas">🚨 SYS: ALARMAS</option>
                <option value="mecanica">⚙️ SYS: MECÁNICA</option>
                <option value="operacion">🎛️ SYS: TEST/OP</option>
            </select>
        </div>
    </header>

    <!-- WORKSPACE CENTRAL -->
    <main class="workspace">
        <div class="cyber-progress-track">
            <div id="progress-bar-fill" class="cyber-progress-bar"></div>
        </div>

        <div id="level-container" class="level-strip">
            <button class="level-pill active" onclick="setLevel(1)">[N1] Radicales</button>
            <button class="level-pill" onclick="setLevel(2)">[N2] Ecuación HMI</button>
        </div>

        <!-- 1. FLASHCARDS -->
        <section id="mode-flashcards" class="mode-screen active">
            <div id="fc-chassis" class="cyber-chassis" onclick="flipCard()" style="cursor: pointer;">
                <div class="hanzi-viewport">
                    <div id="fc-hanzi" class="hanzi-character">--</div>
                </div>
                <div id="fc-pinyin" class="pinyin-label">--</div>
                <div id="fc-body">
                    <span class="inspect-badge">&gt; TOCAR PARA DECODIFICAR &lt;</span>
                </div>
            </div>
            <div class="nav-actions-strip">
                <button class="btn-core btn-ghost" onclick="prevCard()">&lt; PREV</button>
                <span id="fc-counter" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--cyber-cyan); font-weight: 700;">1 / 5</span>
                <button class="btn-core btn-ghost" onclick="nextCard()">NEXT &gt;</button>
            </div>
        </section>

        <!-- 2. QUIZ -->
        <section id="mode-quiz" class="mode-screen">
            <div id="quiz-chassis" class="cyber-chassis">
                <div class="hanzi-viewport" style="margin: 0;">
                    <div id="quiz-hanzi" class="hanzi-character" style="font-size: 4.2rem;">--</div>
                </div>
                <div id="quiz-pinyin" class="pinyin-label" style="font-size: 1.15rem; margin-bottom: 4px;">--</div>
                <div id="quiz-breakdown" class="telemetry-box" style="display: none;"></div>
            </div>
            <div id="quiz-options" class="quiz-options-matrix"></div>
            <button id="quiz-next-btn" class="btn-core btn-cyan full-trigger" onclick="nextQuizQuestion()">SECUENCIA CONFIRMADA &gt;&gt;</button>
        </section>

        <!-- 3. ENSAMBLE -->
        <section id="mode-builder" class="mode-screen">
            <div id="builder-chassis" class="cyber-chassis">
                <div id="builder-meaning" style="font-size: 1.15rem; font-weight: 800; color: var(--cyber-yellow); margin: 4px 0;">--</div>
                <div id="builder-slots" class="assembly-rail"></div>
                <div id="builder-breakdown" class="telemetry-box" style="display: none;"></div>
            </div>
            <div id="builder-pool" class="parts-tray"></div>
            <button id="builder-next-btn" class="btn-core btn-cyan full-trigger" onclick="nextBuilderQuestion()">ENSAMBLE OK &gt;&gt;</button>
        </section>

        <!-- 4. ESCÁNER -->
        <section id="mode-scanner" class="mode-screen">
            <div id="scanner-chassis" class="cyber-chassis" style="justify-content: flex-start;">
                <div id="scanner-task" style="font-size: 0.92rem; font-weight: 800; color: var(--cyber-cyan); margin: 4px 0;">--</div>
                <div id="scanner-alarm-display" class="terminal-display"></div>
                <div id="scanner-breakdown" class="telemetry-box" style="display: none;"></div>
            </div>
            <button id="scanner-next-btn" class="btn-core btn-cyan full-trigger" onclick="nextScannerQuestion()">FALLA RESUELTA &gt;&gt;</button>
        </section>

        <!-- RESUMEN -->
        <section id="mode-summary" class="mode-screen">
            <div class="summary-dashboard">
                <div style="font-size: 2.8rem; margin-bottom: 6px;">⚡</div>
                <h2 style="color: var(--cyber-cyan); font-family: var(--font-display); font-size: 1.3rem;">CICLO DECODIFICADO</h2>
                <div id="summary-percentage" style="font-family: var(--font-mono); font-size: 3.2rem; font-weight: 900; color: var(--cyber-green); margin: 6px 0;">100%</div>
                <p id="summary-details" style="color: var(--text-dim); font-size: 0.8rem; margin-bottom: 16px;">Términos validados sin error crítico.</p>
                <button class="btn-core btn-cyan" style="width: 100%;" onclick="restartSession()">RECARGAR SIGUIENTE CICLO</button>
            </div>
        </section>
    </main>

    <!-- DOCK DE NAVEGACIÓN -->
    <nav class="cyber-dock">
        <button class="dock-item active" onclick="switchMode('flashcards')">
            <svg class="dock-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/></svg>
            <span class="dock-title">Tarjetas</span>
        </button>
        <button class="dock-item" onclick="switchMode('quiz')">
            <svg class="dock-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="2"/></svg>
            <span class="dock-title">Quiz</span>
        </button>
        <button class="dock-item" onclick="switchMode('builder')">
            <svg class="dock-svg" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            <span class="dock-title">Ensamble</span>
        </button>
        <button class="dock-item" onclick="switchMode('scanner')">
            <svg class="dock-svg" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="9" x2="12" y2="15"/></svg>
            <span class="dock-title">Escáner</span>
        </button>
    </nav>

    <!-- MODAL DE CREDENCIAL CYBER -->
    <div id="profile-modal" class="modal-overlay" onclick="closeProfileModal(event)">
        <div class="badge-card" onclick="event.stopPropagation()">
            <div class="badge-header">
                <span>CYBER-HMI SECURITY</span>
                <span>SYS-ID #088</span>
            </div>
            
            <div id="modal-avatar" class="badge-avatar-frame">R</div>
            
            <input type="text" id="modal-name-input" class="badge-input-name" value="Raymundo" maxlength="16" onchange="saveUserName(this.value)">
            
            <div id="modal-rank-name" class="badge-rank-title">Practicante</div>
            <div id="modal-access-level" class="badge-access-tag">NIVEL ACCESO: N1 · OBSERVADOR</div>
            
            <div class="badge-level-bar-bg">
                <div id="modal-rank-progress" class="badge-level-bar-fill" style="width: 10%;"></div>
            </div>
            <div id="modal-xp-details" class="badge-xp-text">0 / 150 XP para ascenso</div>

            <div class="badge-stats-grid">
                <div class="badge-stat-box">
                    <div id="modal-streak-val" class="badge-stat-val">1</div>
                    <div class="badge-stat-lbl">Turnos Activos</div>
                </div>
                <div class="badge-stat-box">
                    <div id="modal-total-xp" class="badge-stat-val">0</div>
                    <div class="badge-stat-lbl">XP Totales</div>
                </div>
            </div>

            <button class="btn-core btn-cyan" style="width: 100%;" onclick="closeProfileModalDirect()">CERRAR CREDENCIAL</button>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

<!-- REGISTRO DEL SERVICE WORKER (PWA) -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/Zidong-Core/sw.js', { scope: '/Zidong-Core/' })
                .then(reg => console.log('Zìdòng Core Service Worker Activo:', reg.scope))
                .catch(err => console.error('Error registrando Service Worker:', err));
        });
    }
</script>
</body>
</html>
