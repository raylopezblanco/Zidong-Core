<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zìdòng Core - HMI Terminal</title>
    
    <!-- PWA & Mobile Engine -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060a12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Fuentes Técnicas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #060a12;
            --panel-bg: rgba(14, 22, 38, 0.75);
            --panel-border: rgba(56, 189, 248, 0.2);
            --card-glow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --status-green: #22c55e;
            --status-red: #ef4444;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --font-ui: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-hanzi: 'Noto Sans SC', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(14, 116, 144, 0.3), transparent 70%),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px, 24px 24px;
            color: var(--text-main);
            font-family: var(--font-ui);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .terminal-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 14px 12px 14px;
        }

        /* HUD SUPERIOR */
        .hmi-hud {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            padding: 6px 10px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .hud-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 8px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
        }
        .badge-streak { color: #fb923c; border-color: rgba(251, 146, 60, 0.3); }
        .badge-xp { color: #facc15; border-color: rgba(250, 204, 21, 0.3); }

        .system-select-wrapper {
            flex: 1;
            position: relative;
        }
        .system-select {
            width: 100%;
            appearance: none;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 5px 22px 5px 8px;
            border-radius: 8px;
            font-size: 0.76rem;
            font-family: var(--font-ui);
            font-weight: 700;
            outline: none;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }
        .system-select-wrapper::after {
            content: "▼";
            font-size: 0.55rem;
            color: var(--accent-cyan);
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* PROGRESO DE CICLO */
        .cycle-progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            margin: 6px 2px 4px 2px;
        }
        .cycle-progress-bar {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--status-green));
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.3s ease;
        }

        /* SELECTOR DE NIVEL */
        .level-selector-strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(0, 0, 0, 0.35);
            padding: 3px;
            border-radius: 10px;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 6px;
        }
        .level-pill {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 5px;
            border-radius: 7px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .level-pill.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-cyan);
            box-shadow: inset 0 0 0 1px var(--accent-cyan);
        }

        /* WORKSPACE Y VISTAS */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .mode-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }
        .mode-screen.active {
            display: flex;
        }

        /* CHASIS CENTRAL DE TARJETA */
        .chassis-card {
            background: linear-gradient(180deg, rgba(16, 26, 46, 0.85) 0%, rgba(9, 14, 26, 0.95) 100%);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
            position: relative;
            box-shadow: var(--card-glow);
            overflow-y: auto;
        }
        .chassis-card::before {
            content: "";
            position: absolute;
            top: 6px;
            left: 8px;
            width: 14px;
            height: 14px;
            border-top: 2px solid var(--accent-cyan);
            border-left: 2px solid var(--accent-cyan);
            opacity: 0.7;
        }
        .chassis-card::after {
            content: "";
            position: absolute;
            bottom: 6px;
            right: 8px;
            width: 14px;
            height: 14px;
            border-bottom: 2px solid var(--accent-cyan);
            border-right: 2px solid var(--accent-cyan);
            opacity: 0.7;
        }

        .hanzi-viewport {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px;
        }
        .hanzi-character {
            font-family: var(--font-hanzi);
            font-size: 5rem;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }

        /* FORMATO CONTROLADO DE TRADUCCIÓN */
        .meaning-title {
            font-size: 1.35rem;
            font-weight: 800;
            line-height: 1.25;
            color: #ffffff;
            text-align: center;
            margin: 6px 0;
            max-width: 95%;
        }

        .pinyin-label {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .inspect-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .nav-actions-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        /* TAGS Y POPUPS TELEMETRÍA */
        .status-pill-tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.12);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .status-pill-alarm {
            color: var(--status-red);
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .telemetry-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 10px;
            padding: 10px 12px;
            margin-top: 8px;
            text-align: left;
        }
        .telemetry-chips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 5px 0;
        }
        .telemetry-chip {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
        }
        .telemetry-chip strong { color: var(--accent-cyan); }
        .telemetry-log {
            font-size: 0.74rem;
            color: var(--text-dim);
            line-height: 1.35;
        }

        /* QUIZ */
        .quiz-options-matrix {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .matrix-button {
            background: rgba(14, 22, 38, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 4px solid #080f1d;
            color: var(--text-main);
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            min-height: 52px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.08s ease;
        }
        .matrix-button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .matrix-button.correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: var(--status-green) !important;
            border-bottom-color: #15803d !important;
            color: #86efac !important;
        }
        .matrix-button.incorrect {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: var(--status-red) !important;
            border-bottom-color: #991b1b !important;
            color: #fca5a5 !important;
        }

        /* ENSAMBLE */
        .assembly-rail {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 8px 0;
        }
        .assembly-slot {
            width: 52px;
            height: 52px;
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-hanzi);
            font-size: 1.8rem;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
        .assembly-slot.active-dock {
            border: 2px solid var(--accent-cyan);
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .parts-tray {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 8px;
        }
        .component-tile {
            width: 48px;
            height: 48px;
            background: #111c33;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-bottom: 4px solid #080f1d;
            border-radius: 10px;
            color: var(--text-main);
            font-family: var(--font-hanzi);
            font-size: 1.6rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.08s ease;
        }
        .component-tile:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .component-tile.used {
            opacity: 0.15;
            pointer-events: none;
            border-bottom-width: 1px;
        }

        /* TERMINAL DE ALARMAS / ESCÁNER */
        .terminal-display {
            width: 100%;
            background: #04070e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 4px solid var(--status-red);
            border-radius: 10px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 1.15rem;
            line-height: 1.8;
            margin: 8px 0;
            word-break: break-all;
        }
        .terminal-token {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .terminal-token:hover {
            border-color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.15);
        }
        .terminal-token.token-static {
            cursor: default;
            color: #475569;
        }
        .terminal-token.token-static:hover {
            border-color: transparent;
            background: transparent;
        }
        .terminal-token.success-hit {
            background: var(--status-green) !important;
            color: white !important;
            font-weight: 700;
            box-shadow: 0 0 10px var(--status-green);
        }
        .terminal-token.fail-hit {
            background: var(--status-red) !important;
            color: white !important;
        }

        /* BOTONES DE ACCIÓN */
        .btn-core {
            border: none;
            border-radius: 12px;
            font-family: var(--font-ui);
            font-weight: 800;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.08s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .btn-core:active {
            transform: translateY(2px);
        }

        .btn-cyan {
            background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border-bottom: 4px solid #075985;
            padding: 12px 16px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
        }
        .btn-cyan:active {
            border-bottom-width: 2px;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 3px solid rgba(0, 0, 0, 0.5);
            color: var(--text-main);
            padding: 8px 14px;
            font-size: 0.78rem;
        }
        .btn-ghost:active {
            border-bottom-width: 1px;
        }

        .full-trigger {
            width: 100%;
            margin-top: 8px;
            display: none;
        }

        .summary-dashboard {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            margin: auto 0;
            box-shadow: var(--card-glow);
        }

        /* DOCK INFERIOR */
        .hmi-dock {
            height: 58px;
            background: rgba(10, 16, 28, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 3px;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.5);
        }

        .dock-item {
            flex: 1;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            padding: 6px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .dock-svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .dock-title {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-top: 3px;
        }
        .dock-item.active {
            color: var(--accent-cyan);
            background: rgba(56, 189, 248, 0.08);
        }
        .dock-item.active::after {
            content: "";
            position: absolute;
            bottom: 3px;
            width: 12px;
            height: 2px;
            background: var(--accent-cyan);
            border-radius: 2px;
            box-shadow: 0 0 6px var(--accent-cyan);
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <!-- SUPERIOR: HUD STATUS -->
    <header class="hmi-hud">
        <div class="hud-badge badge-streak" title="Días consecutivos">
            <span>🔥</span>
            <span id="hud-streak-count">1</span>
        </div>
        <div class="hud-badge badge-xp" title="Experiencia acumulada">
            <span>⚡</span>
            <span id="hud-xp-count">0 XP</span>
        </div>
        <div class="system-select-wrapper">
            <select id="category-selector" class="system-select" onchange="changeCategory(this.value)">
                <option value="todos">🌐 General</option>
                <option value="alarmas">🚨 Alarmas / Seguridad</option>
                <option value="mecanica">⚙️ Mecánica / Actuadores</option>
                <option value="operacion">🎛️ Operación / Test</option>
            </select>
        </div>
    </header>

    <!-- WORKBENCH PRINCIPAL -->
    <main class="workspace">
        <div class="cycle-progress">
            <div id="progress-bar-fill" class="cycle-progress-bar"></div>
        </div>

        <div id="level-container" class="level-selector-strip">
            <button class="level-pill active" onclick="setLevel(1)">Nivel 1: Radicales</button>
            <button class="level-pill" onclick="setLevel(2)">Nivel 2: Ecuación HMI</button>
        </div>

        <!-- 1. FLASHCARDS -->
        <section id="mode-flashcards" class="mode-screen active">
            <div class="chassis-card" onclick="flipCard()" style="cursor: pointer;">
                <div class="hanzi-viewport">
                    <div id="fc-hanzi" class="hanzi-character">--</div>
                </div>
                <div id="fc-pinyin" class="pinyin-label">--</div>
                <div id="fc-body">
                    <span class="inspect-badge">Toca para inspeccionar telemetría</span>
                </div>
            </div>
            <div class="nav-actions-strip">
                <button class="btn-core btn-ghost" onclick="prevCard()">← Anterior</button>
                <span id="fc-counter" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-dim); font-weight: 700;">1 / 5</span>
                <button class="btn-core btn-ghost" onclick="nextCard()">Siguiente →</button>
            </div>
        </section>

        <!-- 2. QUIZ -->
        <section id="mode-quiz" class="mode-screen">
            <div class="chassis-card">
                <span class="status-pill-tag">Diagnóstico de Parámetro</span>
                <div class="hanzi-viewport" style="margin: 0;">
                    <div id="quiz-hanzi" class="hanzi-character" style="font-size: 4rem;">--</div>
                </div>
                <div id="quiz-pinyin" class="pinyin-label" style="font-size: 1.15rem; margin-bottom: 4px;">--</div>
                <div id="quiz-breakdown" class="telemetry-box" style="display: none;"></div>
            </div>
            <div id="quiz-options" class="quiz-options-matrix"></div>
            <button id="quiz-next-btn" class="btn-core btn-cyan full-trigger" onclick="nextQuizQuestion()">Continuar Secuencia → [Espacio]</button>
        </section>

        <!-- 3. ENSAMBLE -->
        <section id="mode-builder" class="mode-screen">
            <div class="chassis-card">
                <span class="status-pill-tag">Secuencia Mecatrónica</span>
                <div id="builder-meaning" style="font-size: 1.15rem; font-weight: 800; color: var(--accent-cyan); margin: 6px 0;">--</div>
                <div id="builder-slots" class="assembly-rail"></div>
                <div id="builder-breakdown" class="telemetry-box" style="display: none;"></div>
            </div>
            <div id="builder-pool" class="parts-tray"></div>
            <button id="builder-next-btn" class="btn-core btn-cyan full-trigger" onclick="nextBuilderQuestion()">Ensamble Confirmado → [Espacio]</button>
        </section>

        <!-- 4. ESCÁNER HMI -->
        <section id="mode-scanner" class="mode-screen">
            <div class="chassis-card" style="justify-content: flex-start;">
                <span class="status-pill-tag status-pill-alarm">Interlock / Alarma de Línea</span>
                <div id="scanner-task" style="font-size: 0.95rem; font-weight: 700; color: var(--accent-cyan); margin: 6px 0;">--</div>
                <div id="scanner-alarm-display" class="terminal-display"></div>
                <div id="scanner-breakdown" class="telemetry-box" style="display: none;"></div>
            </div>
            <button id="scanner-next-btn" class="btn-core btn-cyan full-trigger" onclick="nextScannerQuestion()">Siguiente Incidente → [Espacio]</button>
        </section>

        <!-- RESUMEN -->
        <section id="mode-summary" class="mode-screen">
            <div class="summary-dashboard">
                <div style="font-size: 2.8rem; margin-bottom: 6px;">🎯</div>
                <h2 style="color: var(--accent-cyan); font-size: 1.3rem; font-weight: 800;">Ciclo Concluido</h2>
                <div id="summary-percentage" style="font-family: var(--font-mono); font-size: 3rem; font-weight: 800; color: var(--status-green); margin: 6px 0;">100%</div>
                <p id="summary-details" style="color: var(--text-dim); font-size: 0.85rem; margin-bottom: 16px;">Términos validados correctamente en este bloque.</p>
                <button class="btn-core btn-cyan" style="width: 100%;" onclick="restartSession()">Iniciar Siguiente Ciclo (5 al azar)</button>
            </div>
        </section>
    </main>

    <!-- INFERIOR: BARRA DOCK -->
    <nav class="hmi-dock">
        <button class="dock-item active" onclick="switchMode('flashcards')">
            <svg class="dock-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="8" x2="17" y2="8"/><line x1="7" y1="12" x2="13" y2="12"/></svg>
            <span class="dock-title">Tarjetas</span>
        </button>
